<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEX Library</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fira+Code:wght@400;600;700&family=Outfit:wght@400;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Favicon & Browser Identity -->
  <link rel="icon" type="image/png" href="CODEX_LOGO-preview.png" sizes="any">
  <link rel="apple-touch-icon" href="CODEX_LOGO-preview.png">
  <meta name="theme-color" content="#06b6d4">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Background Ambient Glows -->
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>

  <!-- Top Navigation -->
  <nav id="top-nav">
    <a href="index.html" class="nav-brand">
      <img class="nav-logo" src="CODEX_LOGO-removebg-preview.png" alt="CODEX Logo">
      <div class="nav-titles">
        <div class="nav-title">CODEX Library</div>
        <div class="nav-subtitle">2nd Secondary <span class="ar">| مسار الهندسة والحاسبات</span></div>
      </div>
    </a>

    <div class="nav-actions">
      <a href="index.html" class="btn-nav-back">
        <span>←</span> Back to Library
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="lesson-page" id="lesson-root">

    <!-- Lesson Hero -->
    <header class="lesson-hero">
      <div class="lesson-hero-top">
        <div class="lesson-hero-icon" id="hero-icon">📘</div>
        <div class="lesson-hero-meta">
          <div class="lesson-number-pill" id="hero-tag">LESSON 01</div>
          <h1 class="lesson-title" id="hero-title">Loading...</h1>
          <div class="lesson-title-ar" id="hero-title-ar">جاري التحميل...</div>
        </div>
      </div>
      <p class="lesson-desc" id="hero-desc"></p>
    </header>

    <!-- Two Column Layout -->
    <div class="lesson-layout">

      <!-- 1. The Dynamic Slide Player -->
      <section class="slide-viewer-panel">
        <div class="slide-viewer-header">
          <div class="slide-viewer-title">
            <span>📺</span> Interactive Lesson Viewer
          </div>
          <div class="slide-viewer-controls">
            <button id="btn-grid-toggle" class="btn-slide-ctrl" title="View all slides">
              Grid View <kbd>G</kbd>
            </button>
          </div>
        </div>

        <div class="slide-viewer-progress">
          <div class="slide-progress-meta">Slide <strong id="progress-current">1</strong> of <span
              id="progress-total">1</span></div>
          <div class="slide-progress-track">
            <div class="slide-progress-fill" id="progress-bar"></div>
          </div>
        </div>

        <!-- The stage where slide fragments are injected -->
        <div id="slide-stage">
          <div style="text-align: center; color: var(--text-muted); padding-top: 100px;">
            Loading slides...
          </div>
        </div>

        <!-- Slide Controls (Prev/Next) -->
        <div class="slide-nav-bar">
          <button id="btn-prev" class="btn-nav-slide" title="Previous Slide (Left Arrow, Space)" disabled>❮</button>
          <div class="slide-nav-center" id="slide-nav-meta">Slide 1 / 1</div>
          <button id="btn-next" class="btn-nav-slide" title="Next Slide (Right Arrow, Space)">❯</button>
        </div>
      </section>

      <!-- 2. The Interactive Handout Reader -->
      <section class="handout-panel" id="handout-panel">
        <div class="handout-panel-header" id="handout-toggle">
          <div class="handout-panel-header-left">
            <span>📝</span>
            <span class="handout-panel-title">Digital Handout / Notes</span>
            <span class="handout-count-badge" id="handout-items-count">0 items</span>
          </div>
          <div class="handout-collapse-icon">▼</div>
        </div>

        <div class="handout-body">
          <div class="handout-content" id="handout-content">
            <!-- Handout blocks will be injected here -->
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Grid Modal for Slide Overview -->
  <div id="grid-modal">
    <div class="grid-modal-header">
      <div class="grid-modal-title">
        <span>⊞</span> Slide Overview
      </div>
      <button id="btn-grid-close" class="btn-slide-ctrl">Close ✕</button>
    </div>
    <div class="grid-thumbnails" id="grid-container">
      <!-- Thumbnails generated by JS -->
    </div>
  </div>

  <!-- Data and Logic -->
  <script src="data/lessons.js"></script>
  <script src="js/lesson-player.js"></script>
</body>

</html>
